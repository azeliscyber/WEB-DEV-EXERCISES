<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Petrol Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="calculator-box">

    <h1>Petrol Calculator</h1>
    <p class="intro">Fill in the two fields below, then click the button to see your total cost.</p>


    <label for="cost-per-litre">Cost per Litre (SAR):</label>

    <input type="number" id="cost-per-litre" value="1.72" min="0" step="0.01" />

    <label for="litres">Number of Litres:</label>
    <!-- value="0" means the box starts at 0 when the page loads -->
    <input type="number" id="litres" value="0" min="0" step="1" />

    <!-- When this button is clicked, it runs the calculate() function in script.js -->
    <button id="calculate-btn" onclick="calculate()">Calculate Total</button>


    <!-- This paragraph is empty at first.-->
    <!-- JavaScript will write the answer inside it when we click. -->
    <p id="result"></p>

  </div>

  <!-- This links our JavaScript file so the button works -->
  <script src="script.js"></script>

</body>

</html>
